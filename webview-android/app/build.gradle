plugins { id 'com.android.application' }
def trustedHosts = ['pinflix-nextjs-test.farukkhanone.workers.dev']
def requested = (project.findProperty('PINFLIX_WEB_URL') ?: 'https://pinflix-nextjs-test.farukkhanone.workers.dev/').toString()
def url = new URI(requested)
if (!(url.scheme in ['https','http']) || !(url.host in trustedHosts) ||
 url.rawUserInfo != null || url.rawQuery != null || url.rawFragment != null ||
 url.path != '/' || (url.port != -1 && url.port != 80 && url.port != 443)) {
 throw new GradleException('PINFLIX_WEB_URL must be the root of an approved PinFlix website')
}
if (url.scheme != 'https') throw new GradleException('Only HTTPS Cloudflare test host permitted')
android {
 namespace 'com.pincodeit.pinflix.webview'
 compileSdk 35
 defaultConfig {
  applicationId 'com.pincodeit.pinflix.webview'
  minSdk 24
  targetSdk 35
  versionCode 1
  versionName '1.0.0-webview'
  buildConfigField 'String','PINFLIX_WEB_URL','"' + requested + '"'
 }
 buildTypes {
  release { minifyEnabled false }
  debug { debuggable true }
 }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
