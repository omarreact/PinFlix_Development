plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pincodeit.pinflix'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pincodeit.pinflix'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
