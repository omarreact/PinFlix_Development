name: Build PinFlix Sources Android APK
on:
  pull_request:
    branches: [main]
    paths:
      - 'android-source/**'
      - '.github/workflows/android-direct-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android-source/**'
      - '.github/workflows/android-direct-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK API 35
        run: |
          tool=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$tool"
          yes | "$tool" --licenses >/dev/null || true
          "$tool" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Android app
        run: gradle -p android-source :app:assembleDebug --no-daemon --stacktrace
      - name: Validate APK
        run: |
          test -s android-source/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android-source/app/build/outputs/apk/debug/app-debug.apk | tail -n 1
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PinFlix-Sources-Android-APK
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
