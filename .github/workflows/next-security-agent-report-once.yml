name: Report completed Next.js security agent upgrade once
on:
  push:
    branches:
      - security/nextjs-agent-security-20261026
    paths:
      - .github/workflows/next-security-agent-report-once.yml
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Report completed security agent upgrade
        run: npx --yes next@16.5.0-canary.27 internal report-agent-upgrade 34e46e30-f579-4439-8695-2b2a75f028b9 success
