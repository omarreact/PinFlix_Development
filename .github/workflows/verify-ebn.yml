name: Verify PinFlix Next.js
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, standalone-cloudflare]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinflix-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests and Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Compile production application
        run: npm run build
        env:
          CINEPLEX_PLAYBACK_AUTHORIZED: "false"
          PINFLIX_MATURE_ENABLED: "false"
