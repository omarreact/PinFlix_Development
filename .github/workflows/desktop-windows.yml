name: Build PinFlix Windows installer

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Windows x64 NSIS installer
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Validate desktop entrypoint and generate icon
        working-directory: desktop
        run: npm run check
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist:win
      - name: Publish installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinFlix-Windows-x64-installer
          path: desktop/dist/*.exe
          retention-days: 14
          if-no-files-found: error
