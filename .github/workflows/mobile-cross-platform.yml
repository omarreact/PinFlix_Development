name: Validate unified PinFlix mobile
on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-cross-platform.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
        working-directory: mobile
      - name: Typecheck Android + iOS source
        run: npm run check
        working-directory: mobile
      - name: Test legacy direct-source playback resolution
        run: npm run test:playback
        working-directory: mobile
      - name: Check Expo configuration
        run: npx expo config --type prebuild --json > /dev/null
        working-directory: mobile
