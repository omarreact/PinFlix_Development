name: Build PinFlix Android preview APK
on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pinflix-mobile-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Android SDK platform
        run: |
          tool=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$tool"
          yes | "$tool" --licenses >/dev/null || true
          "$tool" --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install project dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Verify Android source and player code
        working-directory: mobile
        run: npm run check && npm run test:direct && npm run test:playback
      - name: Generate Android native project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build bundled release-preview APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee ../release-build.log
      - name: Record APK SHA-256
        working-directory: mobile
        run: sha256sum android/app/build/outputs/apk/release/*.apk > android-apk.sha256
      - name: Upload versioned APK and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: PinFlix-Android-Direct-2.0.7-Preview
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android-apk.sha256
            mobile/release-build.log
          retention-days: 14
          if-no-files-found: error
  startup-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PinFlix-Android-Direct-2.0.7-Preview
          path: mobile/preview-apk
      - name: Enable emulator hardware acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          script: cd mobile && python3 scripts/startup_smoke.py
      - name: Upload startup crash traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PinFlix-Startup-API-${{ matrix.api-level }}
          path: mobile/android-startup-smoke/
          retention-days: 30
          if-no-files-found: warn
  device-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PinFlix-Android-Direct-2.0.7-Preview
          path: mobile/preview-apk
      - name: Enable Android emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: cd mobile && python3 scripts/device_smoke.py "$(find preview-apk -name '*.apk' -print -quit)"
      - name: Upload on-device report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PinFlix-Android-Direct-2.0.7-Device-Smoke
          path: mobile/android-smoke/
          if-no-files-found: warn
