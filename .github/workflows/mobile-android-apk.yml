name: Build PinFlix Android preview APK
on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pinflix-mobile-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Android SDK platform
        run: |
          tool=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$tool"
          yes | "$tool" --licenses >/dev/null || true
          "$tool" --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install project dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Generate Android native project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build bundled release-preview APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PinFlix-Unified-Android-Preview
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error
